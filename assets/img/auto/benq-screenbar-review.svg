      <stop offset="0%" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
