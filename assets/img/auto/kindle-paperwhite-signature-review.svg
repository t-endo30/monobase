<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#DEDEE1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#25282D" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#shade)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <circle cx="600" cy="300" r="230" fill="none" stroke="#2F5FA8" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="600" cy="300" r="170" fill="none" stroke="#2F5FA8" stroke-opacity=".70" stroke-width="2"/>
  <circle cx="600" cy="300" r="110" fill="none" stroke="#2F5FA8" stroke-opacity=".85" stroke-width="2"/>
  <circle cx="600" cy="300" r="52"  fill="#2F5FA8" fill-opacity=".45"/>
</svg>
