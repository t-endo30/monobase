name: Build & Check

on:
  push:
    branches: [main]
  workflow_dispatch:

# 配信は Cloudflare Pages が担当する（GitHubのリポジトリを直接見ている）。
# ここは「壊れたものを main に入れない」ための検査だけを行う。
permissions:
  contents: read

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check article completeness
        run: python3 tools/check_articles.py

      - name: Build site
        run: python3 build.py

      - name: Check images are optimized
        run: python3 tools/check_images.py

      - name: Check for prohibited expressions
        run: python3 tools/check_text.py

      # 特集を作る段に達したジャンルがあれば、ログに出して気づけるようにする
      # （記事の追加は止めたくないので、失敗にはしない）
      - name: Check feature opportunities
        run: python3 tools/feature_plan.py
        continue-on-error: true

      # ビルド結果がコミット済みの内容と一致しているか確認する。
      # ズレていると、Cloudflare Pages が古いHTMLを配信し続けることになる。
      - name: Ensure build output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::build.py の出力がコミットされていません。ローカルで python3 build.py を実行して commit してください。"
            git status --short
            exit 1
          fi
          echo "✅ 生成物はコミット済みの内容と一致しています"
