name: Build & Check

on:
  push:
    branches: [main]
  workflow_dispatch:

# 配信は Cloudflare Pages が担当する（GitHubのリポジトリを直接見ている）。
# Cloudflare は「コミットされているHTML」をそのまま配るため、
# 管理画面から articles.json だけが変わった場合はここで再生成して
# コミットし直す。そうしないと本文の変更がサイトに出ない。
permissions:
  contents: write

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成物を push し直すため、認証情報を残す
          persist-credentials: true
          # IndexNow で「今回変わったページ」を出すため、1つ前のコミットまで取る
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check article completeness
        run: python3 tools/check_articles.py

      - name: Build site
        run: python3 build.py

      - name: Check images are optimized
        run: python3 tools/check_images.py

      - name: Check for prohibited expressions
        run: python3 tools/check_text.py

      # 特集を作る段に達したジャンルがあれば、ログに出して気づけるようにする
      # （記事の追加は止めたくないので、失敗にはしない）
      - name: Check feature opportunities
        run: python3 tools/feature_plan.py
        continue-on-error: true

      # 生成物にズレがあれば、ここで作り直してコミットする。
      # 管理画面は articles.json と画像だけを push するため、
      # この工程がないと Cloudflare Pages が古いHTMLを配り続ける。
      - name: Commit regenerated site
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ 生成物はコミット済みの内容と一致しています"
            exit 0
          fi
          echo "生成物に差分があります。作り直した内容をコミットします。"
          git status --short
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "サイトを再生成（自動）"
          # 同時に別のpushが入っていることがあるので、取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push に失敗しました。再試行します（$i/3）"
            sleep 5
          done
          echo "::error::生成物のpushに失敗しました"
          exit 1

      # 公開が済んでから、更新を Bing・Yandex などへ知らせる（IndexNow）。
      # 先に知らせると、まだ古い中身を配っている状態で読まれてしまう。
      # Google は IndexNow に参加していないので、サイトマップとリンクで拾われる。
      # 通知できなくても公開自体は済んでいるため、失敗させない。
      - name: Notify IndexNow
        continue-on-error: true
        run: python3 tools/ping_indexnow.py
