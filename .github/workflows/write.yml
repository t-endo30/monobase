name: Write new articles

# 記事の下書きを、週に一度まとめて用意する。
#
#   ① 楽天・Yahoo!から商品の候補を集める      tools/pick_products.py
#   ② 上位N件を下書きにする                   tools/make_drafts.py
#   ③ Claude に本文を書かせる                 tools/write_article.py
#   ④ 書けた記事をレビューして直す             tools/review_article.py
#   ⑤ 検査してプルリクエストを作る
#
# ③は手元で叩くのと同じスクリプトを、同じ `claude` コマンドで動かす。
# 認証は Claude のサブスク（CLAUDE_CODE_OAUTH_TOKEN）を使うので、
# APIの従量課金は発生しない。
#
# main へ直接コミットしない。下書きとはいえ中身を読まずに入れると、
# CIが走って Cloudflare のビルドを消費するため、プルリクエストで止める。
# 公開は、いつもどおり管理画面から手で行う。
on:
  schedule:
    - cron: '0 20 * * 0'      # 毎週月曜 5:00 JST（UTC 日 20:00）
  workflow_dispatch:
    inputs:
      count:
        description: '作る記事の本数'
        required: false
        default: '5'
      model:
        description: 'opus / sonnet'
        required: false
        default: 'opus'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: write-articles
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: 商品の候補を集める
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python3 tools/pick_products.py --limit 30

      - name: 下書きを作る
        run: python3 tools/make_drafts.py --take "${{ github.event.inputs.count || 5 }}"

      - name: 本文を書かせる
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 tools/write_article.py --drafts \
            --model "${{ github.event.inputs.model || 'opus' }}"

      - name: 書けた記事をレビューして直す
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 tools/review_article.py --new \
            --model "${{ github.event.inputs.model || 'opus' }}"
        continue-on-error: true    # 指摘が残っても、下書きはPRに載せて人が見る

      - name: サイトを生成して検査する
        run: |
          python3 build.py
          python3 tools/check_articles.py
          python3 tools/check_text.py
          python3 tools/check_images.py

      - name: プルリクエストにする
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/new-articles
          base: main
          title: '記事の下書きを追加（自動）'
          commit-message: '記事の下書きを追加（自動生成） [skip ci]'
          delete-branch: true
          body: |
            `tools/pick_products.py` → `tools/make_drafts.py` → `tools/write_article.py`
            → `tools/review_article.py` の順で作った下書きです。
            レビューは `docs/review-rules.md`（禁止表現＋ダークパターン）で行っています。**すべて `published: false`** です。

            マージ前に確認してください。

            - [ ] スペック表の数値をメーカー公式で裏取りした
            - [ ] 商品名・型番が、リンク先の商品と一致している
            - [ ] 楽天・Yahoo!のリンクが商品ページを指している（検索結果ではない）
            - [ ] 文章に不自然なところがない

            アイキャッチ画像は入っていません。マージ後、管理画面の「画像」タブから作ってください。
            公開も管理画面から行います。
