name: Write new articles

# 記事を用意して、そのまま公開する。
#
#   ⓪ 今日が実行日か判定する                  tools/schedule_gate.py
#   ① 楽天・Yahoo!から商品の候補を集める      tools/pick_products.py
#   ② 上位N件を下書きにする                   tools/make_drafts.py
#   ③ Claude に本文を書かせる                 tools/write_article.py
#   ④ 楽天・Yahoo!のURLと商品写真を埋める     tools/backfill_shop_urls.py / fetch_shop_images.py
#   ⑤ レビューして直す・公開する               tools/review_article.py（commit・pushはここで1回）
#   ⑥ 通らなかったものはプルリクエストで残す
#
# ④を⑤より前に済ませることで、何本まとめて作る日でも
# push（＝サイトのビルド）は1回にまとまる。以前は④が⑤のあとにあり、
# 埋めた分を別途pushしていたため、1回の実行でビルドが2回走っていた。
#
# 頻度（週に何回）と本数（1日に合計何本）は content/site.json の automation で決める。
# 管理画面の「サイト設定」から変えられる。ここでは毎日まわし、⓪で間引く。
#
# 1日の本数が多いと1回のジョブが90分のタイムアウトに近づくため、
# 1回のジョブは最大5本までとし、それを超える分は下のcronに並べた
# 2回目の実行に回す（⓪が github.event.schedule を見て何本作るか決める）。
#
# ③は手元で叩くのと同じスクリプトを、同じ `claude` コマンドで動かす。
# 認証は Claude のサブスク（CLAUDE_CODE_OAUTH_TOKEN）を使うので、
# APIの従量課金は発生しない。
#
# 公開まで自動で進める（automation.auto_publish）。レビュー基準を満たした
# 記事だけが published:true になり、そのまま push される。
# 出したくない記事は、公開後に管理画面で下書きに戻す。
on:
  schedule:
    - cron: '0 20 * * *'      # 1回目 毎日 5:00 JST（UTC 20:00）。実行日かは⓪で判定
    - cron: '0 4 * * *'       # 2回目 毎日 13:00 JST（UTC 4:00）。1日6本以上のときだけ⓪が実行する
  workflow_dispatch:
    inputs:
      count:
        description: '作る記事の本数（空ならサイト設定に従う）'
        required: false
        default: ''
      model:
        description: 'opus / sonnet'
        required: false
        default: 'opus'
      force:
        description: '曜日の判定を無視して実行する'
        type: boolean
        required: false
        default: true
      rakuten_only:
        description: '楽天の商品ページがある商品だけを選ぶ（一覧に実物写真を出せる）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: write-articles
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 今日が実行日か判定する
        id: gate
        run: |
          python3 tools/schedule_gate.py \
            --schedule "${{ github.event.schedule }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Claude Code を入れる
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 商品の候補を集める
        if: steps.gate.outputs.run == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          python3 tools/pick_products.py --limit 30 \
            ${{ inputs.rakuten_only && '--require-rakuten' || '' }}

      - name: 下書きを作る
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 tools/make_drafts.py \
            --take "${{ inputs.count || steps.gate.outputs.count }}"

      # 口コミの件数と平均評価を、販売APIから取っておく。
      # これがあると、記事は「レビュー1,284件・平均4.3」と数字で書ける。
      # 無いときは、今までどおり数字を書かせない。
      - name: 口コミの件数・平均評価を取る
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true          # 取れなくても記事は書ける
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python3 tools/fetch_reviews.py

      # 書き終えると、そのまま tools/review_article.py のレビューまで走る
      # （--no-review を付けない限り）。禁止表現・架空の星評価・比較表の
      # 未確認値は書かせた直後の出力に高い割合で混ざるため。
      # write_article.py は、書いた記事がレビュー基準を満たさなかった
      # だけでも exit 1 で終わる（機械検査に禁止表現が残った・API側の
      # 一時的な失敗でレビューをやり直せなかった、など）。ここに
      # continue-on-error が無いと、1本でも通らないだけでジョブ全体が
      # 止まり、後続の「レビューして公開する」や「下書きをPRにする」
      # （通らなかった記事を人に渡す救済策）まで実行されなくなる
      # （実際に2026-09-07の実行でこれが起きた）。続く工程は
      # published:true にしない限り公開されないので、続行して安全。
      - name: 本文を書かせる（レビューまで通す）
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          # 予備を Secrets に入れておくと、1本目が期限切れや上限に
          # 当たったとき、次のものへ自動で移る（tools/write_article.py）。
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          python3 tools/write_article.py --drafts \
            --model "${{ inputs.model || 'opus' }}"

      - name: git の名前を決める
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "monobase-bot"
          git config user.email "monobase.site@gmail.com"

      # 候補集めの段階で楽天・Yahoo!のURLが取れていない商品がある。
      # そのまま公開すると、そのモールの販売ボタンが出ない＝収益経路が無い。
      # ここで検索APIから引き直して埋める（見つからなければ空のまま）。
      #
      # レビュー・公開（次のステップ）より前に済ませる。以前は公開の
      # あとに埋めていたため、1回の実行で「公開のpush」と「埋めた分の
      # push」の2回に分かれ、ビルドが2回走っていた。ここで先に埋めて
      # おけば、次のレビュー・公開の1回のcommit・push・ビルドに
      # まとまる（10本まとめて作る日でも、ビルドは1回で済む）。
      - name: 抜けている楽天・Yahoo!の商品URLを埋める
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true          # 埋まらなくても公開は進める
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python3 tools/backfill_shop_urls.py --apply --include-drafts

      # 本文の商品カードに出す「実物の商品写真」を、同じ検索APIから拾う。
      # 保存するのはURLだけで、画像は当サイトへ持ってこない（各モールの規約）。
      # 上のステップで楽天・Yahoo!のURLが埋まった直後に走らせる
      # （写真は、そのモールのボタンが出ている記事にしか入れないため）。
      - name: 商品カードの写真を拾う
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true          # 拾えなくても公開は進める
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python3 tools/fetch_shop_images.py --apply

      # レビューを通ったものは published:true にして push する
      # （build.py もこの中で1回だけ走る）。通らなかったものは
      # 下書きのまま残り、次のステップでPRになる。
      - name: レビューして公開する
        id: review
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.auto_publish == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          python3 tools/review_article.py --new --publish --push \
            --model "${{ inputs.model || 'opus' }}"

      - name: レビューして直す（公開はしない）
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.auto_publish != 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          python3 tools/review_article.py --new \
            --model "${{ inputs.model || 'opus' }}"

      - name: サイトを生成して検査する
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 build.py
          python3 tools/check_articles.py
          python3 tools/check_text.py
          python3 tools/check_images.py

      # ここまでの push は「レビューして公開する」の1回で済んでいる
      # はずだが、そのpushが弾かれて取りこぼした場合や、直前の
      # 「サイトを生成して検査する」で画像最適化などの差分が出た場合に
      # 備えて、残っていれば出し直す（通常は「出すものはありません」で
      # 何もしない）。
      - name: 残っていれば出し直す
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.auto_publish == 'true'
        run: |
          # 作業中の変更が無くても、前の手順が commit だけ済ませて push に
          # 失敗している場合がある。その取りこぼしもここで出し直す。
          git fetch -q origin main
          if git diff --quiet && [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "出すものはありません。"
            exit 0
          fi
          git add content/articles.json articles assets/img/auto assets/img/gen
          git add -u
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "取りこぼした分を出し直す（自動）"
          fi
          # 取り込みが衝突したまま止まると、次の試行が「まだ rebase の
          # 途中です」で必ず失敗する。実際それで3回とも空振りした。
          # やり直す前に、必ず中断した取り込みを片付ける。
          #
          # 衝突するのは生成したHTMLの ?v= スタンプ行だけなので、
          # こちらの側を採ってから build.py で計算し直す。
          for i in 1 2 3; do
            git push && exit 0
            echo "push が弾かれました（$i回目）。取り込んで出し直します"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort 2>/dev/null || true
              continue
            fi
            python3 build.py >/dev/null
            git add content/articles.json articles assets/img/auto assets/img/gen
            git add -u
            git diff --cached --quiet || git commit -q --amend --no-edit
          done
          echo "::error::push できませんでした"
          exit 1

      # 公開まで自動にしていないときだけ、下書きをPRにして人に渡す。
      # 自動公開のときは、通らなかった記事も published:false のまま main に入り、
      # 管理画面の「下書き」に並ぶ。
      - name: 下書きをプルリクエストにする
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.auto_publish != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/new-articles
          base: main
          title: '公開できなかった下書き（自動）'
          commit-message: '公開できなかった下書き（自動生成） [skip ci]'
          delete-branch: true
          body: |
            自動生成のうち、`tools/review_article.py` の基準を満たさなかった記事です。
            レビュー基準は `docs/review-rules.md`。

            公開できたものは、すでに `main` に入っています。

            - [ ] スペック表の数値をメーカー公式で裏取りした
            - [ ] 商品名・型番が、リンク先の商品と一致している
            - [ ] 楽天・Yahoo!のリンクが商品ページを指している（検索結果ではない）
            - [ ] 文章に不自然なところがない

            アイキャッチ画像は、公開時に自動で作られます。
