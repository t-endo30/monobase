name: Fetch shop data

# 既存記事に、商品カードへ出す「実物の商品写真」と、価格・口コミの
# 件数・平均評価を埋める。どちらも楽天・Yahoo!の公式APIが返した値で、
# このサイトが記事に載せられる数少ない一次データにあたる。
#
# 記事が持つのはURLだけで、画像は当サイトへ保存しない。
# 楽天ウェブサービスの規約で、取得した画像の複製・再配信はできないため
# （表示するときは楽天へのリンクを添える。build.py がその形で出す）。
#
# APIの鍵は Secrets にしか無いため、手元ではなくここで実行する。
# まず apply を外して（下見）実行し、ログに並んだ商品名とURLを見てから
# apply を付けて実行し直す。別の商品の写真を掴んでいないかの確認は人がやる。
#
# write.yml の中でも公開直前に1回呼んでいるが、そこは continue-on-error
# （拾えなくても公開は進める）なので、検索APIの一時的な失敗やレート制限に
# 当たった記事はサムネイル無しのまま永久に残ってしまう（2026-09-18に、
# 楽天・Yahoo!のURLを持つのに shop_images が空の記事が10本溜まっているのを
# 確認した：再試行する仕組みがこのworkflow_dispatch専用ジョブしか無く、
# 誰かが手動で回さない限り拾い直されなかったのが原因）。
# 未取得の記事だけを毎日拾い直す下の cron で、取りこぼしを自動で埋める。
on:
  schedule:
    # 分は0・30ちょうどを避ける（GitHubのscheduled workflowは毎時0分・30分に
    # 混雑し、負荷次第でトリガーが飛ばされることがある）。
    - cron: '48 19 * * *'      # 毎日 4:48 JST（記事作成 5:07 JST の前に済ませる）
  workflow_dispatch:
    inputs:
      apply:
        description: '記事に書き戻す（外すと下見だけ）'
        type: boolean
        required: false
        default: false
      slug:
        description: '対象の記事スラッグ（空なら全部）'
        required: false
        default: ''
      force:
        description: 'すでに写真が入っている記事も調べ直す'
        type: boolean
        required: false
        default: false
      limit:
        description: '調べる記事数の上限（0で全部）'
        required: false
        default: '0'
      debug:
        description: '検索語ごとの件数と、返ってきた商品を出す'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-shop-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 商品カードの写真を探す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          python3 tools/fetch_shop_images.py \
            --limit "${{ inputs.limit || '0' }}" \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.debug && '--debug' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      # 価格・口コミ件数・平均評価も同じ回で拾い直す。
      #
      # 記事に載る唯一の一次データで、これが空だと本文は「〜とされて
      # います」だけになり、読者から見て中身の薄いページになる
      # （2026-09-27時点で、価格の載った記事が0本・口コミ件数の載った
      #   記事が9本しかなかった）。価格は毎日変わるので、写真と違って
      # 「一度取れたら終わり」ではなく毎日取り直す必要がある。
      #
      # continue-on-error にはしない。取れなかった記事は review_stats が
      # 前の値のまま残るだけで、ここが落ちるのはAPIの鍵が切れたときなど
      # 本物の異常だけ。
      - name: 価格・口コミの件数と平均評価を取る
        if: github.event_name == 'schedule' || inputs.apply
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          python3 tools/fetch_reviews.py \
            ${{ inputs.slug || '' }}

      - name: サイトを生成して検査する
        if: github.event_name == 'schedule' || inputs.apply
        run: |
          python3 build.py
          python3 tools/check_articles.py

      # 触るのは記事のデータと、そこから生成したページだけ。
      # 何が入ったのかログに残す。
      - name: 変更をコミットする
        if: github.event_name == 'schedule' || inputs.apply
        run: |
          git config user.name  "monobase-bot"
          git config user.email "monobase.site@gmail.com"
          if git diff --quiet; then
            echo "変わったところはありません。"
            exit 0
          fi
          git add content/articles.json articles assets/img/auto
          git add -u
          git diff --cached --stat
          git commit -m "商品カードの写真・価格・口コミを既存記事に補う（自動）"
          # 価格を毎日入れ直すようになって、このジョブは毎日コミットする。
          # そのぶん、走っているあいだに別のワークフロー（記事公開・
          # サイト再生成）が origin/main を進めている確率も上がった。
          # 素の push だと ! [rejected] で落ちるので、取り込んでから
          # 出し直す。衝突するのは生成物HTMLの ?v= スタンプ行だけなので、
          # こちら側を採って build.py を流し直せば整合する。
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push が弾かれました。取り込んで出し直します（$i 回目）"
            git pull --rebase -X ours origin main || git rebase --abort
            python3 build.py
            git add -u
            git diff --cached --quiet || git commit --amend --no-edit
          done
          echo "::error::3回試しても push できませんでした"
          exit 1
