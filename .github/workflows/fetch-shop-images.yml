name: Fetch shop images

# 既存記事に、本文の商品カードへ出す「実物の商品写真」のURLを埋める。
#
# 記事が持つのはURLだけで、画像は当サイトへ保存しない。
# 楽天ウェブサービスの規約で、取得した画像の複製・再配信はできないため
# （表示するときは楽天へのリンクを添える。build.py がその形で出す）。
#
# APIの鍵は Secrets にしか無いため、手元ではなくここで実行する。
# まず apply を外して（下見）実行し、ログに並んだ商品名とURLを見てから
# apply を付けて実行し直す。別の商品の写真を掴んでいないかの確認は人がやる。
#
# write.yml の中でも公開直前に1回呼んでいるが、そこは continue-on-error
# （拾えなくても公開は進める）なので、検索APIの一時的な失敗やレート制限に
# 当たった記事はサムネイル無しのまま永久に残ってしまう（2026-09-18に、
# 楽天・Yahoo!のURLを持つのに shop_images が空の記事が10本溜まっているのを
# 確認した：再試行する仕組みがこのworkflow_dispatch専用ジョブしか無く、
# 誰かが手動で回さない限り拾い直されなかったのが原因）。
# 未取得の記事だけを毎日拾い直す下の cron で、取りこぼしを自動で埋める。
on:
  schedule:
    # 分は0・30ちょうどを避ける（GitHubのscheduled workflowは毎時0分・30分に
    # 混雑し、負荷次第でトリガーが飛ばされることがある）。
    - cron: '48 19 * * *'      # 毎日 4:48 JST（記事作成 5:07 JST の前に済ませる）
  workflow_dispatch:
    inputs:
      apply:
        description: '記事に書き戻す（外すと下見だけ）'
        type: boolean
        required: false
        default: false
      slug:
        description: '対象の記事スラッグ（空なら全部）'
        required: false
        default: ''
      force:
        description: 'すでに写真が入っている記事も調べ直す'
        type: boolean
        required: false
        default: false
      limit:
        description: '調べる記事数の上限（0で全部）'
        required: false
        default: '0'
      debug:
        description: '検索語ごとの件数と、返ってきた商品を出す'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-shop-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 商品カードの写真を探す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          python3 tools/fetch_shop_images.py \
            --limit "${{ inputs.limit || '0' }}" \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.debug && '--debug' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      - name: サイトを生成して検査する
        if: github.event_name == 'schedule' || inputs.apply
        run: |
          python3 build.py
          python3 tools/check_articles.py

      # 触るのは記事のデータと、そこから生成したページだけ。
      # 何が入ったのかログに残す。
      - name: 変更をコミットする
        if: github.event_name == 'schedule' || inputs.apply
        run: |
          git config user.name  "monobase-bot"
          git config user.email "monobase.site@gmail.com"
          if git diff --quiet; then
            echo "変わったところはありません。"
            exit 0
          fi
          git add content/articles.json articles assets/img/auto
          git add -u
          git diff --cached --stat
          git commit -m "商品カードの写真URLを既存記事に補う（自動）"
          git push
