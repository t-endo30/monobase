name: Update access ranking

# GA4 のページビューを取り込んで content/ranking.json を更新する。
# 変更があればコミットし、デプロイのワークフローが走って反映される。
on:
  schedule:
    - cron: '0 20 * * *'      # 毎日 5:00 JST（UTC 20:00）
  workflow_dispatch:           # 手動実行も可

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet google-analytics-data

      # サービスアカウントの鍵を一時ファイルに書き出す。
      # 鍵はJSONなので、コマンドラインに直接埋め込まず環境変数から渡す。
      - name: Write service account key
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: |
          if [ -z "$GA4_SA_KEY" ]; then
            echo "GA4_SA_KEY が未設定です。ランキングの更新はスキップします。"
            exit 0
          fi
          printf '%s' "$GA4_SA_KEY" > "$RUNNER_TEMP/ga4-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4-sa.json" >> "$GITHUB_ENV"

      - name: Fetch ranking from GA4
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 tools/fetch_ranking.py --days 28

      - name: Commit if changed
        run: |
          if git diff --quiet -- content/ranking.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ranking.json
          git commit -m "アクセスランキングを更新（GA4）"
          git push
