name: Generate article images

# 画像のない記事に対して、Gemini で写真風の画像を作る。
# 自動では走らせない（生成は課金され、内容の確認も要るため）。
# Actions タブから手動で実行する。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: '対象の記事スラッグ（空なら画像のない記事すべて）'
        required: false
        default: ''
      limit:
        description: '1回に作る枚数の上限'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Generate images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が未登録です。Settings → Secrets で登録してください。"
            exit 1
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            python3 tools/make_images.py --slug "${{ inputs.slug }}"
          else
            python3 tools/make_images.py --all --limit "${{ inputs.limit }}"
          fi

      - name: Check image size
        run: python3 tools/check_images.py

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "変更なし"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/gen content/articles.json
          git commit -m "記事の画像をAIで生成"
          git push
