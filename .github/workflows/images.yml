name: Generate article images

# 画像のない記事に対して、Gemini で写真風の画像を作る。
# 自動では走らせない（生成は課金され、内容の確認も要るため）。
# Actions タブから手動で実行する。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: '対象の記事スラッグ（空なら画像のない記事すべて）'
        required: false
        default: ''
      limit:
        description: '1回に作る枚数の上限'
        required: false
        default: '5'
      force:
        description: 'すでに画像がある記事も作り直す（プロンプトを変えたとき）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 同時に走らせない。どの実行も content/articles.json と生成した
# ページを書き換えるので、並ぶと push のたびに衝突する。
# 実際に3本同時に流して1本が rebase の衝突で落ちた。
concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Generate images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が未登録です。Settings → Secrets で登録してください。"
            exit 1
          fi
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          if [ -n "${{ inputs.slug }}" ]; then
            python3 tools/make_images.py --slug "${{ inputs.slug }}" $FORCE
          else
            python3 tools/make_images.py --all --limit "${{ inputs.limit }}" $FORCE
          fi

      - name: サイトを生成して検査する
        run: |
          python3 build.py
          python3 tools/check_images.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          if git diff --quiet && [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "変更なし"; exit 0
          fi
          git add assets/img/gen content/articles.json articles assets/img/auto
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "記事の画像をAIで生成"
          fi
          # この実行の最中に別の作業が main へ入っていると push は弾かれる。
          # 作った画像がそのまま消えるので、取り込んでから出し直す。
          # 取り込みが衝突したまま止まると、次の試行が必ず失敗する。
          # やり直す前に、中断した取り込みを片付ける。
          for i in 1 2 3; do
            git push && exit 0
            echo "push が弾かれました（$i回目）。取り込んで出し直します"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort 2>/dev/null || true
              continue
            fi
            python3 build.py >/dev/null
            git add assets/img/gen content/articles.json articles assets/img/auto
            git add -u
            git diff --cached --quiet || git commit -q --amend --no-edit
          done
          echo "::error::push できませんでした"
          exit 1
